<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Yanforms Sign</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Ce parapheur a demenage dans Yanforms Sign le 30/09/2026. Un ancien lien de signature
// #/signer/<jeton> mene au meme document sur yanforms.com/s/<jeton> ; tout le reste va sur /sign.
(function () {
  var brut = location.hash.replace(/^#\/?/, "");
  var parts = brut.split("/");
  var cible = "https://yanforms.com/sign";
  if (parts[0] === "signer" && /^[A-Za-z0-9_-]{32}$/.test(parts[1] || "")) cible = "https://yanforms.com/s/" + parts[1];
  location.replace(cible);
})();
</script>
<meta http-equiv="refresh" content="1;url=https://yanforms.com/sign">

</head><body><p>This tool moved to <a href="https://yanforms.com/sign">yanforms.com/sign</a>. Taking you there.</p></body></html>
